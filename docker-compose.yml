version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: ml_platform_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: ml_doctor_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ml_platform_backend
    environment:
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/ml_doctor_db
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ./data:/app/uploaded_datasets

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ml_platform_frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
